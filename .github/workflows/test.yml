name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is the minimum declared in go.mod and must keep compiling;
        # 1.26 is the current release.
        go-version: ['1.25', '1.26']
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run CI pipeline
      run: make ci
